name: Scrape, Build, and Deploy Job Crawler

on:
  schedule:
    # Runs at 9 AM and 5 PM UTC
    - cron: '0 9,17 * * *'
  workflow_dispatch: # Allows manual triggering

# Sets permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write # Needed for committing the jobs.json file
  pages: write      # Needed for deploying to GitHub Pages
  id-token: write   # Needed for OIDC token authentication

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Python scraper
        run: python backend/scraper.py

      - name: Commit and push job data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add frontend/src/jobs.json
          if ! git diff --staged --quiet; then
            git commit -m "Automated job scrape update"
            git push
          else
            echo "No new jobs found. Skipping commit."
          fi
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React application
        working-directory: ./frontend
        run: |
          chmod +x ./node_modules/.bin/vite
          npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
